name: Build Tingwu Home V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tingwu-home-v2-android.zip'
      - '.github/workflows/build-tingwu-home-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -q tingwu-home-v2-android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p tingwu-home-v2 assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tingwu-home-v2-debug-apk
          path: tingwu-home-v2/app/build/outputs/apk/debug/app-debug.apk

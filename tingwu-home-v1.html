<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>听霧的小家 · V1.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e3e5;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.pill{background:#ffffffdf;color:#24343a;padding:9px 12px;border-radius:14px;font-size:13px;box-shadow:0 3px 14px #0002;backdrop-filter:blur(8px)}
button{border:0;border-radius:12px;padding:10px 13px;background:#263d43;color:white;font-weight:600;font-size:13px}
#top button{pointer-events:auto}
#hint{position:absolute;left:50%;top:68px;transform:translateX(-50%);max-width:90%;text-align:center;background:#ffffffd9;color:#34464b;padding:8px 12px;border-radius:12px;font-size:12px}
#pad{position:absolute;left:18px;bottom:24px;width:116px;height:116px;border-radius:50%;background:#ffffff55;border:1px solid #fff9;display:none;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#314b52dd;left:33px;top:33px}
#look{position:absolute;right:16px;bottom:28px;color:#fff;background:#20343a99;padding:10px 12px;border-radius:12px;font-size:12px;display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#e9efed;color:#263d43;font-size:15px}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="loading">正在打開听霧的小家……</div>
<div id="top">
 <div class="pill"><b>听霧的小家</b><br><span style="font-size:11px">HOME · 建築雛形 V1.0</span></div>
 <button id="mode">切換第一人稱</button>
</div>
<div id="hint">環視模式：單指拖曳旋轉 · 雙指縮放</div>
<div id="pad"><div id="stick"></div></div>
<div id="look">拖曳右側畫面轉動視角</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const canvas=document.getElementById("renderCanvas"), engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
const scene=new BABYLON.Scene(engine); scene.clearColor=new BABYLON.Color4(.78,.86,.87,1);
const camera=new BABYLON.ArcRotateCamera("orbit",-Math.PI/2,1.08,18,new BABYLON.Vector3(0,1.2,0),scene);
camera.attachControl(canvas,true); camera.lowerRadiusLimit=8;camera.upperRadiusLimit=30;camera.wheelPrecision=45;
const hemi=new BABYLON.HemisphericLight("sky",new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.9;
const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-1,.4),scene);sun.position=new BABYLON.Vector3(8,12,-8);sun.intensity=.7;
function mat(name,color){let m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);return m}
const floor=mat("warm oak","#b88e68"),wall=mat("warm white","#eee9df"),accent=mat("soft sage","#9cae9e"),dark=mat("charcoal","#45545a"),glass=mat("glass blue","#a9cbd0"),sofa=mat("sofa","#9aada8");
function box(name,x,y,z,w,h,d,m){let b=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);b.position.set(x,y,z);b.material=m;return b}
box("Ground",0,-.18,0,24,.25,20,mat("ground","#899b83"));
box("House floor",0,0,0,12,.22,9,floor);
// exterior and interior walls, deliberately partial for a readable dollhouse view
box("Back wall",0,1.55,4.5,12,3.1,.18,wall);
box("Left wall",-6,1.55,0,.18,3.1,9,wall);
box("Right wall",6,1.55,0,.18,3.1,9,wall);
box("Bedroom divider",-1.3,1.5,-1.3,.16,3,3.8,wall);
box("Study divider",2.3,1.5,1.2, .16,3,4.3,wall);
box("Kitchen island",3.9,.55,-2.6,2.5,1.05,1.1,wall);
box("Counter top",3.9,1.12,-2.6,2.65,.12,1.2,dark);
box("Dining table",1.0,.8,-2.7,2.1,.14,1.1,floor);
for(let x of [.25,1.75])for(let z of [-3.5,-1.9])box("Dining chair",x,.42,z,.42,.8,.42,accent);
box("Sofa",-3.7,.55,-2.6,2.5,.85,1.05,sofa);
box("Coffee table",-3.6,.35,-.9,1.7,.12,.8,floor);
box("Bed",-3.8,.35,2.4,2.5,.45,2.5,wall);box("Mattress",-3.8,.63,2.4,2.35,.18,2.35,sofa);
box("Wardrobe",-5.15,1.15,2.5,.9,2.3,2.2,floor);
box("Desk",3.9,.75,2.9,2.2,.12,.9,floor);box("Desk legs",3.9,.35,2.9,1.9,.7,.12,dark);
box("Bookcase",5.25,1.25,-.5,.9,2.5,2.1,floor);
box("Rug",-3.3,.13,-1.6,3.7,.035,2.6,mat("rug","#d8c8b1"));
// front garden and path
box("Front patio",0,-.03,-6.2,8,.12,3,mat("stone","#c7c4b8"));
for(let x of [-4.8,4.8]){let trunk=box("Tree trunk",x,.75,-7,.28,1.5,.28,floor);let crown=BABYLON.MeshBuilder.CreateSphere("Tree crown",{diameter:1.7},scene);crown.position.set(x,1.9,-7);crown.material=accent;}
const label=(txt,x,z)=>{let p=BABYLON.MeshBuilder.CreatePlane("label",{width:2.2,height:.45},scene);p.position.set(x,2.9,z);let t=new BABYLON.DynamicTexture("dt",{width:512,height:128},scene);t.drawText(txt,20,88,"bold 54px Arial","#43534f","transparent",true);let mm=new BABYLON.StandardMaterial("lm",scene);mm.diffuseTexture=t;mm.emissiveColor=new BABYLON.Color3(1,1,1);p.material=mm;p.rotation.y=0;};
label("LIVING ROOM",-3.4,.1);label("KITCHEN",3.7,.1);
let first=false,keys={},yaw=0,pitch=0,joy={x:0,y:0};
const mode=document.getElementById("mode"),pad=document.getElementById("pad"),stick=document.getElementById("stick"),look=document.getElementById("look"),hint=document.getElementById("hint");
let fp;
function enterFP(){first=true;camera.detachControl();fp=new BABYLON.UniversalCamera("walk",new BABYLON.Vector3(0,1.65,-3.8),scene);fp.speed=.12;fp.angularSensibility=3500;fp.minZ=.08;fp.attachControl(canvas,true);fp.applyGravity=false;fp.checkCollisions=false;scene.activeCamera=fp;pad.style.display="block";look.style.display="block";hint.textContent="第一人稱：左下搖桿移動 · 拖曳畫面轉頭";mode.textContent="切換環視";}
function exitFP(){first=false;fp.detachControl();fp.dispose();scene.activeCamera=camera;camera.attachControl(canvas,true);pad.style.display="none";look.style.display="none";hint.textContent="環視模式：單指拖曳旋轉 · 雙指縮放";mode.textContent="切換第一人稱";}
mode.onclick=()=>first?exitFP():enterFP();
let active=false,pid=null,cx=0,cy=0;
pad.addEventListener("pointerdown",e=>{active=true;pid=e.pointerId;pad.setPointerCapture(pid);moveJoy(e)});
pad.addEventListener("pointermove",e=>{if(active&&e.pointerId===pid)moveJoy(e)});
function moveJoy(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=34;if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
function stopJoy(){active=false;joy.x=joy.y=0;stick.style.transform="translate(0,0)"}
pad.addEventListener("pointerup",stopJoy);pad.addEventListener("pointercancel",stopJoy);
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
scene.onBeforeRenderObservable.add(()=>{if(!first)return;let f=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-joy.y;let r=(keys.d||keys.arrowright?1:0)+(keys.a||keys.arrowleft?-1:0)+joy.x;let dir=fp.getDirection(new BABYLON.Vector3(r,0,f));fp.cameraDirection.addInPlace(dir.scale(.055));});
engine.runRenderLoop(()=>scene.render());window.addEventListener("resize",()=>engine.resize());
document.getElementById("loading").style.display="none";
</script>
</body></html>
